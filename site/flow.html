<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How wh works — Walter Dalla</title>
<meta name="description" content="Interactive step-by-step of wh-harness: the plugin's agents and the files each one reads, writes, runs or deletes.">
<link rel="canonical" href="https://walter-dalla.github.io/wh-harness/en/">
<link rel="alternate" hreflang="en" href="https://walter-dalla.github.io/wh-harness/en/">
<link rel="alternate" hreflang="pt-BR" href="https://walter-dalla.github.io/wh-harness/pt/">
<link rel="alternate" hreflang="x-default" href="https://walter-dalla.github.io/wh-harness/flow.html">
<meta name="author" content="Walter Dalla Torre Neto">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="https://walterdalla.uk/favicon.ico">
<link rel="apple-touch-icon" href="https://walterdalla.uk/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>
  // Before first paint.
  // Language: the path wins (/pt/ and /en/ are copies of this file, made by .github/workflows/pages.yml),
  // then ?lang=, then the browser language.
  // ?embed=1: the page is inside the iframe of walterdalla.uk, with no header, title or outer padding of its own.
  // Theme: ?theme= beats the wd-theme key (same name as the portfolio's), which beats the system.
  try {
    var q = new URLSearchParams(location.search)
    var m = location.pathname.match(/\/(pt|en)\/(?:index\.html)?$/)
    var l = m ? m[1] : q.get('lang')
    if (l !== 'pt' && l !== 'en') l = /^pt\b/i.test(navigator.language || '') ? 'pt' : 'en'
    document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en'
    if (q.get('embed') === '1') document.documentElement.classList.add('embed')
    var t = q.get('theme')
    if (t !== 'light' && t !== 'dark') t = localStorage.getItem('wd-theme')
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    document.documentElement.dataset.theme = t
    document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f7f6f2' : '#0b0d10'
  } catch (e) {}
</script>
<style>
/* Portfolio tokens (src/styles/global.css) + one color per actor of the flow. */
:root,:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#121418; --surface2:#1c1f25; --border:#262a31; --strong:#383d46;
  --text:#e6e8eb; --muted:#a9afb8; --faint:#8a919b; --accent:#f5a524; --btn-bg:#f5a524; --btn-fg:#0b0d10;
  --c-owner:#a9afb8; --c-hook:#b28be6; --c-orch:#f5a524; --c-enrich:#45c1b8; --c-dev:#76a2f0; --c-qa:#ef7a8a; --c-script:#9cc165; --c-skill:#d29a63;
  color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f7f6f2; --surface:#ffffff; --surface2:#efede7; --border:#dedcd5; --strong:#c9c6bd;
  --text:#15171a; --muted:#5b6169; --faint:#666c73; --accent:#9a5b0b; --btn-bg:#15171a; --btn-fg:#f7f6f2;
  --c-owner:#5b6169; --c-hook:#7a4fb0; --c-orch:#9a5b0b; --c-enrich:#16807a; --c-dev:#2f62b8; --c-qa:#bf3d4f; --c-script:#5b7a2e; --c-skill:#8a5a2b;
  color-scheme:light}
:root{--sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --gutter:clamp(16px,4vw,48px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono)}

/* Header in the style of the site */
.site-header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.site-header__inner,.wrap{max-width:1380px;margin:0 auto;padding-inline:max(var(--gutter),env(safe-area-inset-left,0px))}
.site-header__inner{padding-block:8px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:inline-flex;align-items:center;min-height:44px;font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;justify-content:flex-end}
.back{display:inline-flex;align-items:center;min-height:44px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.back:hover{color:var(--text)}
.brand,.back{white-space:nowrap}
@media (max-width:520px){.back{display:none}}
.lang{display:inline-flex;border:1px solid var(--strong);border-radius:8px;overflow:hidden}
.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:40px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lang a:hover{color:var(--text)}
.lang a[aria-current="true"]{background:var(--surface2);color:var(--text);font-weight:600}
.lang a:focus-visible{outline-offset:-2px}
.theme-toggle{width:44px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--strong);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}

.wrap{display:flex;flex-direction:column;gap:20px;padding-block:clamp(32px,5vw,64px) 48px}
header.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--accent);margin:0 0 12px}
h1{margin:0;font-size:clamp(34px,4.6vw,56px);line-height:1.04;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
h1 code{font-weight:600;color:var(--accent)}
.lede{color:var(--muted);max-width:680px;margin:14px 0 0;font-size:clamp(15px,1.4vw,18px);line-height:1.6}
.rule{font-family:var(--mono);font-size:12.5px;border:1px solid var(--border);background:var(--surface);padding:12px 14px;border-radius:8px;max-width:440px;color:var(--muted)}
.rule b{color:var(--accent)}
.rule code{color:var(--text)}
.tabs{display:flex;gap:4px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tab{font-family:var(--mono);font-size:13px;background:none;border:0;color:var(--muted);padding:0;min-height:44px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

/* Three columns only when the file tree fits without cutting names; the portfolio's iframe is ~1100px wide. */
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1240px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stage{grid-column:1/-1;order:-1}}
@media (max-width:680px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{min-width:0}
.col h2{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:500}

/* actors */
.actors{display:flex;flex-direction:column;gap:6px}
.actor{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);transition:opacity .25s,box-shadow .25s}
.actor .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.actor .nm{font-family:var(--mono);font-size:13px;font-weight:600}
.actor .rl{font-size:12.5px;color:var(--muted);line-height:1.3}
.actor.idle{opacity:.45}
.actor.on{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c);opacity:1}
.actor.sel{background:var(--surface2)}
.actor:focus-visible,.stepdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{margin-top:10px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:14px;font-size:13.5px}
.card h3{margin:0 0 4px;font-family:var(--mono);font-size:14px;color:var(--c)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0 0}
.card dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding-top:2px}
.card dd{margin:0}
.card code,.narr code,.msg code,.note code{font-size:.88em;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* stage */
.stage{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:clamp(16px,2vw,24px);display:flex;flex-direction:column;gap:16px;min-width:0}
.phase{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.phase .pn{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 8px}
.phase h3{font-size:clamp(22px,2.2vw,28px);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15;text-wrap:balance}
.narr{margin:0;max-width:70ch;color:var(--muted);line-height:1.65}
.msg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;border:1px dashed var(--strong);border-radius:8px;padding:12px 14px;background:var(--bg)}
.msg .who{font-weight:600;color:var(--c)}
.msg .arrow{color:var(--faint)}
.msg .pl{flex-basis:100%;color:var(--text);white-space:pre-wrap;word-break:break-word}
.msg.anim .pl{animation:type .5s ease-out}
@keyframes type{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.note{font-size:13.5px;border-left:2px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);margin:0}
.note b{color:var(--text)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--strong);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn:disabled{opacity:.4;cursor:default}
.count{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.stepdot{all:unset;cursor:pointer;height:6px;flex:1 1 18px;min-width:14px;border-radius:3px;background:var(--border)}
.stepdot.done{background:color-mix(in srgb,var(--accent) 45%,var(--border))}
.stepdot.cur{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--faint)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* board */
.board{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:190px}
.board .bh{position:sticky;top:0;background:var(--surface2);padding:6px 12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.board ol{list-style:none;margin:0;padding:6px 12px}
.board li{white-space:pre;color:var(--muted);font-variant-numeric:tabular-nums}
.board li.new{color:var(--text);animation:type .4s}
.board li .k{font-weight:600}
.board .empty{color:var(--faint);padding:6px 0;font-style:italic;white-space:normal}

/* files */
.tree{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 0;font-family:var(--mono);font-size:12.5px;overflow-x:auto}
.grp{padding:10px 12px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.grp small{display:block;letter-spacing:0;text-transform:none;font-family:var(--sans);font-size:12px}
.f{display:flex;align-items:baseline;gap:6px;padding:3px 12px;transition:background .25s,opacity .25s;min-height:24px}
.f .path{min-width:0;overflow-wrap:anywhere}
.f .p{color:var(--faint)}
.f .n{color:var(--text)}
.f.idle{opacity:.5}
.f.hit{opacity:1;background:var(--surface2)}
.f.gone .n{text-decoration:line-through}
.op{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;color:var(--bg);background:var(--c);flex:none;white-space:nowrap}
.ops{margin-left:auto;display:flex;gap:4px;flex:none}
footer{color:var(--faint);font-size:12.5px;border-top:1px solid var(--border);padding-top:16px}
footer code{color:var(--muted)}
footer a{color:var(--accent)}

/* flow map */
.flowmap{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.flowmap .mh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--faint)}
.flowmap .mh b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.mapscroll{overflow-x:auto}
.mapscroll svg{display:block;width:100%;min-width:640px;height:auto}
.node{cursor:pointer;outline:none}
.node rect{fill:var(--bg);stroke:var(--border);stroke-width:1.5;transition:fill .3s,stroke .3s}
.node.done rect{stroke:color-mix(in srgb,var(--accent) 55%,var(--border))}
.node.cur rect{fill:color-mix(in srgb,var(--accent) 14%,var(--surface));stroke:var(--accent);stroke-width:2.5}
.node:hover rect,.node:focus-visible rect{stroke:var(--accent)}
.node:focus-visible rect{stroke-width:3}
.node .lb{font-family:var(--mono);font-size:10.5px;fill:var(--faint);letter-spacing:.06em}
.node.cur .lb{fill:var(--accent)}
.node .tt{font-family:var(--sans);font-size:14.5px;font-weight:600;fill:var(--text)}
.node.idle .tt{fill:var(--muted)}
.node .ad{stroke:var(--surface);stroke-width:1.5}
.node.idle .ad{opacity:.45}
.edge{fill:none;stroke:var(--strong);stroke-width:2;transition:stroke .3s}
.edge.lit{stroke:color-mix(in srgb,var(--accent) 70%,var(--border))}
.edge.cur{stroke:var(--accent);stroke-width:3;stroke-dasharray:8 6;animation:flow .8s linear infinite}
.edge.loop{stroke-dasharray:4 4}
.edge.loop.cur{stroke-dasharray:8 6}
@keyframes flow{to{stroke-dashoffset:-14}}
.mk{fill:var(--strong)} .mk.lit{fill:var(--accent)}
.elabel{font-family:var(--mono);font-size:10.5px;fill:var(--faint)}
.elabel.cur{fill:var(--accent);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Embed mode: the portfolio already gives header, section title, theme, language and margins.
   The page is a borderless part of the host: same background tokens, no padding, and nothing drawn outside
   its box (the iframe would clip an outline or a shadow at the edge). The background stays opaque: a transparent
   iframe gets the browser's own canvas color when its color-scheme differs from the host's. */
.embed .site-header,.embed .eyebrow,.embed h1{display:none}
.embed .wrap{padding:0;max-width:none;gap:16px}
.embed .lede{margin-top:0;font-size:15px}
.embed .tab:focus-visible,.embed .actor:focus-visible{outline-offset:-2px}
</style>
</head>
<body>
<div class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="https://walterdalla.uk/">~/walter-dalla</a>
    <div class="tools">
      <a class="back" href="https://walterdalla.uk/projects/wh-harness">← wh-harness</a>

</div>

<main class="wrap">
  <header class="intro">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n="lede"></p>

  <div class="grid">

    <section class="stage" aria-live="polite">
      <div class="steps" id="dots"></div>

        <button class="btn" id="prev" type="button" data-i18n="prev"></button>

</main>

<script>
const root=document.documentElement;
let lang=root.lang==="en"?"en":"pt";
/* A text is a plain string (same in both languages) or {pt,en}. */
const L=v=>v&&typeof v==="object"&&!Array.isArray(v)&&("pt" in v)?v[lang]:v;

/* Theme: same key as the portfolio. */
(function(){
  const btn=document.getElementById("theme");
  const icon=t=>t==="dark"
    ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const apply=t=>{
    root.dataset.theme=t; btn.innerHTML=icon(t);
    document.querySelector('meta[name="theme-color"]').content=t==="light"?"#f7f6f2":"#0b0d10";
  };
  btn.innerHTML=icon(root.dataset.theme);
  btn.onclick=()=>{
    const t=root.dataset.theme==="dark"?"light":"dark";
    apply(t);
    try{localStorage.setItem("wd-theme",t)}catch(e){}
  };

  /* Iframe protocol (src/components/ProjectEmbed.jsx in the portfolio).
     In:  {type:"wh-flow:theme",theme} and {type:"wh-flow:lang",lang}.
     Out: {type:"wh-flow:height",height}, on every resize and again after every message from the parent:
     the first height can leave before the parent is listening, and it would be lost. */
  const PARENTS=["https://walterdalla.uk","http://localhost:3000"];
  const embedded=root.classList.contains("embed")&&window.parent!==window;
  // postMessage to the wrong origin is dropped (with a console warning): aim at the real parent when known.
  let targets=PARENTS;
  try{const a=location.ancestorOrigins&&location.ancestorOrigins[0];if(a&&PARENTS.includes(a))targets=[a]}catch(e){}
  let last=0;
  const postHeight=force=>{
    if(!embedded) return;
    const h=Math.ceil(document.body.getBoundingClientRect().height);
    if(!force&&h===last) return; last=h;
    targets.forEach(o=>window.parent.postMessage({type:"wh-flow:height",height:h},o));
  };
  window.addEventListener("message",e=>{
    if(!PARENTS.includes(e.origin)) return;
    const d=e.data;
    if(!d||typeof d.type!=="string"||d.type.indexOf("wh-flow:")!==0) return;
    targets=[e.origin];
    if(d.type==="wh-flow:theme"&&(d.theme==="dark"||d.theme==="light")) apply(d.theme);
    if(d.type==="wh-flow:lang"&&(d.lang==="pt"||d.lang==="en")) setLang(d.lang);
    postHeight(true);
  });
  if(embedded&&"ResizeObserver" in window) new ResizeObserver(()=>postHeight(false)).observe(document.body);
})();

const UI = {
  en:{title:"How wh works — Walter Dalla",
    desc:"Interactive step-by-step of wh-harness: the plugin's agents and the files each one reads, writes, runs or deletes.",
    langLabel:"Language",themeLabel:"Toggle light/dark theme",
    eyebrow:"// wh-harness · interactive flow",h1:"How <code>wh</code> works",
    lede:"Step by step through the plugin's agents and the files each one reads, writes, runs or deletes. Pick a flow, move with the buttons or with ← →, and click an actor to see what it can and cannot do.",
    rule:"The skill has the <b>procedure</b>, the profile has the <b>facts</b>. No skill cites a project command: it cites <code>profile § Section</code>.",

const $=s=>document.querySelector(s);

function stepLabel(s){return s.pn==="pre"?U("pre"):(flow==="impl"?U("phase"):U("step"))+" "+s.pn}
function renderMap(){
  const F=FLOWS[flow], st=F.steps, W=180,H=74,gx=46,gy=56,pad=24;
  const cols=Math.max(...F.pos.map(p=>p[0]))+1, rows=Math.max(...F.pos.map(p=>p[1]))+1;
  const vw=pad*2+cols*W+(cols-1)*gx, vh=pad*2+rows*H+(rows-1)*gy;
  const B=F.pos.map(([c,r])=>({x:pad+c*(W+gx),y:pad+r*(H+gy)}));
  const cx=b=>b.x+W/2, cy=b=>b.y+H/2;
  let edges="",labels="";
  const fwd=(A,C)=>{
    if(A.y===C.y) return C.x>A.x?`M${A.x+W},${cy(A)} L${C.x-2},${cy(C)}`:`M${A.x},${cy(A)} L${C.x+W+2},${cy(C)}`;
    if(A.x===C.x) return `M${cx(A)},${A.y+H} L${cx(C)},${C.y-2}`;
    const my=(A.y+H+C.y)/2; return `M${cx(A)},${A.y+H} L${cx(A)},${my} L${cx(C)},${my} L${cx(C)},${C.y-2}`;
  };
  for(let j=1;j<st.length;j++){
    const cls=j<i?"lit":j===i?"cur":"";
    edges+=`<path class="edge ${cls}" d="${fwd(B[j-1],B[j])}" marker-end="url(#mk${cls?"-lit":""})"/>`;
  }
  (F.loops||[]).forEach(([a,b,lab])=>{
    const A=B[a],C=B[b],cur=a===i, cls=`edge loop ${cur?"cur":""}`;
    let d,lx,ly,anchor="middle";
    if(A.y===C.y){
      const dir=C.x>A.x?1:-1, x1=cx(A)+dir*W*0.28, x2=cx(C)-dir*W*0.28;
      d=`M${x1},${A.y} C${x1},${A.y-38} ${x2},${C.y-38} ${x2},${C.y-2}`; lx=(x1+x2)/2; ly=A.y-32;
    } else {
      const x=A.x+24; d=`M${x},${A.y} L${x},${C.y+H+2}`; lx=x+6; ly=(A.y+C.y+H)/2+4; anchor="start";
    }
    edges+=`<path class="${cls}" d="${d}" marker-end="url(#mk${cur?"-lit":""})"/>`;
    labels+=`<text class="elabel ${cur?"cur":""}" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(L(lab))}</text>`;
  });
  const short=F.short[lang];
  const nodes=st.map((s,j)=>{
    const b=B[j], state=j<i?"done":j===i?"cur":"idle";
    const lines=short[j].split("\n");
    const tt=lines.map((l,k)=>`<tspan x="${b.x+12}" y="${b.y+(lines.length===1?46:39)+k*17}">${esc(l)}</tspan>`).join("");
    const dots=s.a.map((a,k)=>`<circle class="ad" cx="${b.x+W-12-k*11}" cy="${b.y+14}" r="4.5" style="fill:${col(a)}"><title>${L(ACTORS[a].n)}</title></circle>`).join("");
    return `<g class="node ${state}" data-j="${j}" tabindex="0" role="button" aria-label="${U("goTo")}: ${esc(L(s.t))}"><title>${esc(L(s.t))}</title><rect x="${b.x}" y="${b.y}" width="${W}" height="${H}" rx="8"/><text class="lb" x="${b.x+12}" y="${b.y+18}">${stepLabel(s).toUpperCase()}</text><text class="tt">${tt}</text>${dots}</g>`;
  }).join("");
  $("#map").innerHTML=`<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="${U("mapOf")} ${esc(F.label)}"><defs>
    <marker id="mk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="mk-lit" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="mk lit" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>${edges}${labels}${nodes}</svg>`;
  $("#map").querySelectorAll(".node").forEach(g=>{
    const jump=()=>{stop();i=+g.dataset.j;render()};
    g.onclick=jump; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();jump()}};
  });
}
let flow="impl", i=0, sel="orch", timer=null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function col(a){return `var(${ACTORS[a].c})`}

/* Static texts, document metadata and the language switch. */
function langHref(l){
  const u=new URL(location.href);
  if(/\/(pt|en)\/(?:index\.html)?$/.test(u.pathname)) u.pathname=u.pathname.replace(/\/(pt|en)\/(?:index\.html)?$/,"/"+l+"/");
  else u.searchParams.set("lang",l);
  return u.pathname+u.search;
}
function applyStatic(){
  root.lang=lang==="pt"?"pt-BR":"en";
  document.title=U("title");
  document.querySelector('meta[name="description"]').content=U("desc");
  document.querySelector('link[rel="canonical"]').href=`https://walter-dalla.github.io/wh-harness/${lang}/`;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=U(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-label]").forEach(el=>el.setAttribute("aria-label",U(el.dataset.i18nLabel)));
  $("#lang").innerHTML=["pt","en"].map(l=>`<a href="${esc(langHref(l))}" hreflang="${l}" aria-current="${l===lang}">${l.toUpperCase()}</a>`).join("");
  $("#play").textContent=U(timer?"pause":"play");
}
function setLang(l){
  if(l===lang) return;
  lang=l; applyStatic(); buildTabs(); buildActors(); buildTree(); renderCard(); render();
}

function buildTabs(){
  $("#tabs").innerHTML=Object.entries(FLOWS).map(([k,v])=>`<button class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="${k===flow}">${v.label}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{flow=b.dataset.k;i=0;stop();buildTabs();render();try{localStorage.setItem("wh-flow",flow)}catch(e){}});
}
function buildActors(){
  $("#actors").innerHTML=Object.entries(ACTORS).map(([k,a])=>`<button class="actor" id="actor-${k}" data-k="${k}" style="--c:${col(k)}"><span class="dot"></span><span><span class="nm">${L(a.n)}</span><br><span class="rl">${L(a.r)}</span></span></button>`).join("");
  $("#actors").querySelectorAll(".actor").forEach(b=>b.onclick=()=>{sel=b.dataset.k;renderCard();markActors()});
  $("#legend").innerHTML=Object.values(OPS).map(v=>`<span><b style="font-family:var(--mono)">${L(v)}</b></span>`).join(" · ")+`<span>${U("legend")}</span>`;
}
function buildTree(){
  $("#tree").innerHTML=GROUPS.map(g=>`<div class="grp">${L(g.t)}${L(g.s)?`<small>${L(g.s)}</small>`:""}</div>`+g.files.map(([id,p,n])=>`<div class="f" id="f-${id}"><span class="path"><span class="p">${p}</span> <span class="n">${L(n)}</span></span><span class="ops"></span></div>`).join("")).join("");
}
function renderCard(){
  const a=ACTORS[sel];
  $("#card").style.setProperty("--c",col(sel));
  $("#card").innerHTML=`<h3>${L(a.n)}</h3><div style="color:var(--muted)">${L(a.r)}</div><dl>${Object.entries(a.d[lang]).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
}
function markActors(){
  const s=FLOWS[flow].steps[i];
  document.querySelectorAll(".actor").forEach(b=>{const k=b.dataset.k;b.classList.toggle("on",s.a.includes(k));b.classList.toggle("idle",!s.a.includes(k));b.classList.toggle("sel",k===sel)});
}
function boardUpTo(){
  const steps=FLOWS[flow].steps; const lines=[]; let t=new Date(Date.UTC(2026,10,9,14,2,0));
  steps.forEach((s,j)=>{(s.b||[]).forEach(b=>{t=new Date(t.getTime()+ (7+lines.length*3)*60000); if(j<=i) lines.push({b,cur:j===i,t:new Date(t)})})});
  if(flow!=="impl"){$("#board").innerHTML=`<li class="empty">${U("boardOnly")}</li>`;return}
  if(!lines.length){$("#board").innerHTML=`<li class="empty">${U("boardEmpty")}</li>`;return}
  $("#board").innerHTML=lines.map(({b,cur,t})=>`<li class="${cur?"new":""}">${t.toISOString().slice(0,19)}Z | ${b[0].padEnd(12)} | <span class="k">${b[1].padEnd(8)}</span> | ${esc(L(b[2]))}</li>`).join("");
  const box=$("#board").parentElement; box.scrollTop=box.scrollHeight;
}
function render(){
  const st=FLOWS[flow].steps, s=st[i];
  $("#pn").textContent=stepLabel(s);
  $("#st").textContent=L(s.t);
  $("#narr").innerHTML=L(s.n);
  const [fr,to,tx]=s.m;
  const m=$("#msg"); m.classList.remove("anim"); void m.offsetWidth; m.classList.add("anim");
  m.innerHTML=`<span class="who" style="--c:${col(fr)}">${L(ACTORS[fr].n)}</span>`+(fr!==to?`<span class="arrow">→</span><span class="who" style="--c:${col(to)}">${L(ACTORS[to].n)}</span>`:`<span class="arrow">${U("output")}</span>`)+`<span class="pl">${esc(L(tx))}</span>`;
  $("#note").innerHTML=L(s.note)||""; $("#note").hidden=!s.note;
  $("#dots").innerHTML=st.map((x,j)=>`<button class="stepdot ${j<i?"done":""} ${j===i?"cur":""}" data-j="${j}" aria-label="${U("stepN")} ${j+1}: ${esc(L(x.t))}" title="${esc(L(x.t))}"></button>`).join("");
  $("#dots").querySelectorAll(".stepdot").forEach(b=>b.onclick=()=>{stop();i=+b.dataset.j;render()});
  $("#count").textContent=`${i+1} / ${st.length}`;
  $("#prev").disabled=i===0; $("#next").disabled=i===st.length-1;
  if(!s.a.includes(sel)) {sel=s.a.find(a=>a!=="owner")||s.a[0]; renderCard();}
  markActors();
  const touched=s.f||{};
  document.querySelectorAll(".f").forEach(el=>{
    const id=el.id.slice(2); let v=touched[id];
    const ops=el.querySelector(".ops");
    if(!v){el.classList.add("idle");el.classList.remove("hit","gone");ops.innerHTML="";return}
    if(typeof v[0]==="string") v=[v];
    el.classList.remove("idle");el.classList.add("hit");el.classList.toggle("gone",v.some(o=>o[0]==="d"));
    ops.innerHTML=v.map(([o,a])=>`<span class="op" style="--c:${col(a)}" title="${L(ACTORS[a].n)} ${L(OPS[o])}">${L(OPS[o])}</span>`).join("");
  });
  boardUpTo();
  renderMap();
}
function go(d){const n=FLOWS[flow].steps.length;i=Math.max(0,Math.min(n-1,i+d));render()}
function stop(){clearInterval(timer);timer=null;$("#play").textContent=U("play")}
$("#prev").onclick=()=>{stop();go(-1)};
$("#next").onclick=()=>{stop();go(1)};
$("#play").onclick=()=>{
  if(timer){stop();return}
  if(i===FLOWS[flow].steps.length-1) i=0, render();
  $("#play").textContent=U("pause");
  timer=setInterval(()=>{if(i>=FLOWS[flow].steps.length-1){stop();return}go(1)},3800);
};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowRight"){stop();go(1)}if(e.key==="ArrowLeft"){stop();go(-1)}});
try{const f=localStorage.getItem("wh-flow");if(f&&FLOWS[f])flow=f}catch(e){}
applyStatic();buildTabs();buildActors();buildTree();renderCard();render();
</script>
</body>
</html>
